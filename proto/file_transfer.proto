syntax = "proto3";

package chatroom.v9;

enum FileTransferScope {
  FILE_TRANSFER_SCOPE_UNSPECIFIED = 0;
  FILE_TRANSFER_PRIVATE = 1;
  FILE_TRANSFER_GROUP = 2;
}

message FileTransferMetadata {
  string transfer_token = 1;
  FileTransferScope scope = 2;
  string sender_username = 3;
  string recipient_username = 4;
  uint64 group_id = 5;
  string group_name = 6;
  string file_name = 7;
  uint64 file_size = 8;
  string sha256_hex = 9;
  int64 created_at_unix_ms = 10;
  string stored_relative_path = 11;
}
